<!doctype html>
<html lang="bn">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Dalimgari Admin ও Manager Login"
    >

    <title>Login | Dalimgari</title>

    <link
        rel="stylesheet"
        href="login.css"
    >

</head>


<body>

    <main
        class="login-container"
        aria-labelledby="loginTitle"
    >

        <section
            class="login-box"
            aria-describedby="loginDescription"
        >

            <h1 id="loginTitle">
                Login
            </h1>

            <p id="loginDescription">
                Admin অথবা Manager হিসেবে প্রবেশ করুন
            </p>


            <form
                id="loginForm"
                novalidate
            >

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    autocomplete="username"
                    placeholder="Username"
                    maxlength="100"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    placeholder="Password"
                    maxlength="200"
                    required
                >


                <button
                    type="submit"
                    id="loginButton"
                    class="login-button"
                >
                    Login
                </button>

            </form>


            <p
                id="loginMessage"
                class="login-message"
                role="alert"
                aria-live="polite"
            ></p>


            <div class="back-to-website">

                <a href="index.html">
                    ← মূল ওয়েবসাইটে ফিরে যান
                </a>

            </div>

        </section>

    </main>


    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

    <script src="supabase-client.js"></script>


    <script>

        const MAX_ATTEMPTS = 5;

        const LOCK_TIME = 30000;

        let attempts = 0;

        let lockedUntil = 0;

        let processing = false;


        const form =
            document.getElementById("loginForm");

        const usernameInput =
            document.getElementById("username");

        const passwordInput =
            document.getElementById("password");

        const loginButton =
            document.getElementById("loginButton");

        const message =
            document.getElementById("loginMessage");


        function showMessage(text, type = "info") {

            if (!message) return;

            message.textContent = text;

            message.dataset.type = type;

        }


        function setLoading(loading) {

            loginButton.disabled = loading;

            loginButton.textContent =
                loading
                    ? "Login হচ্ছে..."
                    : "Login";

        }


        function isLocked() {

            return Date.now() < lockedUntil;

        }


        function registerFailure() {

            attempts++;

            if (attempts >= MAX_ATTEMPTS) {

                attempts = 0;

                lockedUntil =
                    Date.now() + LOCK_TIME;

                showMessage(
                    "অনেকবার ভুল Login হয়েছে। ৩০ সেকেন্ড পরে আবার চেষ্টা করুন।",
                    "error"
                );

                return;

            }

            showMessage(
                "Username অথবা Password সঠিক নয়।",
                "error"
            );

        }


        function resetAttempts() {

            attempts = 0;

            lockedUntil = 0;

        }


        async function login(event) {

            event.preventDefault();

            if (processing) {
                return;
            }


            if (isLocked()) {

                showMessage(
                    "কিছুক্ষণ পরে আবার চেষ্টা করুন।",
                    "error"
                );

                return;

            }


            const username =
                String(
                    usernameInput.value || ""
                ).trim().toLowerCase();


            const password =
                String(
                    passwordInput.value || ""
                );


            if (!username) {

                showMessage(
                    "Username দিন।",
                    "error"
                );

                return;

            }


            if (!password) {

                showMessage(
                    "Password দিন।",
                    "error"
                );

                return;

            }


            try {

                processing = true;

                setLoading(true);

                showMessage("");


                const supabase =
                    window.DalimgariSupabase;


                if (
                    !supabase ||
                    !supabase.rpc
                ) {

                    throw new Error(
                        "Supabase client পাওয়া যায়নি।"
                    );

                }


                const {
                    data,
                    error
                } = await supabase.rpc(
                    "dalimgari_login",
                    {
                        p_username:
                            username,

                        p_password:
                            password
                    }
                );


                console.log(
                    "Dalimgari login result:",
                    data,
                    error
                );


                if (error) {

                    console.error(
                        "Login RPC error:",
                        error
                    );

                    throw error;

                }


                if (
                    !data ||
                    !data.length
                ) {

                    registerFailure();

                    passwordInput.value = "";

                    return;

                }


                const user =
                    data[0];


                const role =
                    String(
                        user.role || ""
                    ).toLowerCase();


                if (
                    role !== "admin" &&
                    role !== "manager"
                ) {

                    registerFailure();

                    passwordInput.value = "";

                    return;

                }


                /*
                 * Temporary application session.
                 *
                 * এটি password সংরক্ষণ করে না।
                 */

                sessionStorage.setItem(
                    "dalimgariUser",
                    JSON.stringify({
                        username:
                            user.username,

                        role:
                            role,

                        loginAt:
                            new Date().toISOString(),

                        sessionVersion:
                            "temporary-v1"
                    })
                );


                resetAttempts();


                showMessage(
                    "Login সফল হয়েছে।",
                    "success"
                );


                if (role === "admin") {

                    window.location.replace(
                        "admin-dashboard.html"
                    );

                    return;

                }


                if (role === "manager") {

                    window.location.replace(
                        "manager-dashboard.html"
                    );

                    return;

                }


            } catch (error) {

                console.error(
                    "Dalimgari Login Error:",
                    error
                );


                showMessage(
                    "Login সিস্টেমে সমস্যা হয়েছে। আবার চেষ্টা করুন।",
                    "error"
                );

            } finally {

                processing = false;

                setLoading(false);

            }

        }


        form.addEventListener(
            "submit",
            login
        );


        usernameInput.addEventListener(
            "input",
            function () {
                showMessage("");
            }
        );


        passwordInput.addEventListener(
            "input",
            function () {
                showMessage("");
            }
        );


        document.addEventListener(
            "DOMContentLoaded",
            function () {

                usernameInput.focus();

            }
        );

    </script>

</body>

</html>
