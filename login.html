<!doctype html>
<html lang="bn">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Dalimgari Admin ও Manager Login"
    >

    <title>Login | Dalimgari</title>

    <link
        rel="stylesheet"
        href="login.css"
    >

</head>


<body>

    <main
        class="login-container"
        aria-labelledby="loginTitle"
    >

        <section
            class="login-box"
            aria-describedby="loginDescription"
        >

            <h1 id="loginTitle">
                Login
            </h1>


            <p id="loginDescription">
                Admin অথবা Manager হিসেবে প্রবেশ করুন
            </p>


            <!-- ==========================================
                 LOGIN FORM
            =========================================== -->

            <form
                id="loginForm"
                novalidate
            >

                <label for="username">
                    Username
                </label>


                <input
                    type="text"
                    id="username"
                    name="username"
                    autocomplete="username"
                    placeholder="Username"
                    maxlength="100"
                    required
                    aria-required="true"
                >


                <label for="password">
                    Password
                </label>


                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    placeholder="Password"
                    maxlength="200"
                    required
                    aria-required="true"
                >


                <button
                    type="submit"
                    id="loginButton"
                    class="login-button"
                >
                    Login
                </button>

            </form>


            <!-- ==========================================
                 LOGIN MESSAGE
            =========================================== -->

            <p
                id="loginMessage"
                class="login-message"
                role="alert"
                aria-live="polite"
            ></p>


            <!-- ==========================================
                 BACK TO WEBSITE
            =========================================== -->

            <div class="back-to-website">

                <a href="index.html">
                    ← মূল ওয়েবসাইটে ফিরে যান
                </a>

            </div>

        </section>

    </main>


    <!-- ==============================================
         SUPABASE
    =============================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

    <script src="supabase-client.js"></script>


    <!-- ==============================================
         AUTHENTICATION CONTROLLER
    =============================================== -->

    <script>

        /* ==================================================
           DALIMGARI — SUPABASE LOGIN
           Authentication:
           Supabase Auth

           Authorization:
           public.profiles.role

           IMPORTANT:
           No password is stored locally.
           No fake session is created.
        ================================================== */


        /* ==================================================
           CONFIGURATION
        ================================================== */

        const DALIMGARI_LOGIN_MAX_ATTEMPTS = 5;

        const DALIMGARI_LOGIN_LOCK_TIME = 30000;


        /* ==================================================
           LOGIN STATE
        ================================================== */

        let loginAttempts = 0;

        let loginLockedUntil = 0;

        let loginProcessing = false;


        /* ==================================================
           ELEMENTS
        ================================================== */

        const loginForm =
            document.getElementById(
                "loginForm"
            );


        const usernameInput =
            document.getElementById(
                "username"
            );


        const passwordInput =
            document.getElementById(
                "password"
            );


        const loginButton =
            document.getElementById(
                "loginButton"
            );


        const loginMessage =
            document.getElementById(
                "loginMessage"
            );


        /* ==================================================
           SUPABASE CLIENT
        ================================================== */

        function getSupabaseClient() {

            const client =
                window.DalimgariSupabase;


            if (
                !client ||
                !client.auth
            ) {

                throw new Error(
                    "Supabase client পাওয়া যায়নি।"
                );

            }


            return client;

        }


        /* ==================================================
           MESSAGE
        ================================================== */

        function showLoginMessage(
            message,
            type = "info"
        ) {

            if (!loginMessage) {
                return;
            }


            loginMessage.textContent =
                message || "";


            loginMessage.dataset.type =
                type;

        }


        /* ==================================================
           LOADING
        ================================================== */

        function setLoginLoading(
            loading
        ) {

            if (!loginButton) {
                return;
            }


            loginButton.disabled =
                loading;


            loginButton.setAttribute(
                "aria-busy",
                loading
                    ? "true"
                    : "false"
            );


            loginButton.textContent =
                loading
                    ? "Login হচ্ছে..."
                    : "Login";

        }


        /* ==================================================
           USERNAME → EMAIL
        ================================================== */

        function getAuthenticationEmail(
            username
        ) {

            const normalizedUsername =
                String(
                    username || ""
                )
                    .trim()
                    .toLowerCase();


            if (
                normalizedUsername ===
                "admin"
            ) {

                return "admin@dalimgari.local";

            }


            if (
                normalizedUsername ===
                "manager"
            ) {

                return "manager@dalimgari.local";

            }


            return null;

        }


        /* ==================================================
           INPUT VALIDATION
        ================================================== */

        function validateLoginInput(
            username,
            password
        ) {

            if (!username) {

                return {

                    valid: false,

                    message:
                        "Username দিন।"

                };

            }


            if (!password) {

                return {

                    valid: false,

                    message:
                        "Password দিন।"

                };

            }


            if (
                username.length >
                100
            ) {

                return {

                    valid: false,

                    message:
                        "Username সঠিক নয়।"

                };

            }


            if (
                password.length >
                200
            ) {

                return {

                    valid: false,

                    message:
                        "Password সঠিক নয়।"

                };

            }


            return {

                valid: true,

                message: ""

            };

        }


        /* ==================================================
           LOGIN LOCK
        ================================================== */

        function isLoginLocked() {

            return (
                Date.now() <
                loginLockedUntil
            );

        }


        function registerLoginFailure() {

            loginAttempts++;


            if (
                loginAttempts >=
                DALIMGARI_LOGIN_MAX_ATTEMPTS
            ) {

                loginLockedUntil =
                    Date.now() +
                    DALIMGARI_LOGIN_LOCK_TIME;


                loginAttempts = 0;


                showLoginMessage(
                    "অনেকবার ভুল Login হয়েছে। ৩০ সেকেন্ড পরে আবার চেষ্টা করুন।",
                    "error"
                );


                return;

            }


            showLoginMessage(
                "Username অথবা Password সঠিক নয়।",
                "error"
            );

        }


        function resetLoginAttempts() {

            loginAttempts = 0;

            loginLockedUntil = 0;

        }


        /* ==================================================
           GET AUTH USER PROFILE
        ================================================== */

        async function getUserProfile(
            userId
        ) {

            const supabase =
                getSupabaseClient();


            const {
                data,
                error
            } = await supabase

                .from("profiles")

                .select(
                    "id, role, enabled"
                )

                .eq(
                    "id",
                    userId
                )

                .maybeSingle();


            if (error) {

                throw error;

            }


            if (!data) {

                return null;

            }


            /*
             * Only these roles are allowed
             * to access the admin area.
             */

            if (
                data.role !== "admin" &&
                data.role !== "manager"
            ) {

                return null;

            }


            /*
             * Disabled users cannot login.
             */

            if (
                data.enabled !== true
            ) {

                return null;

            }


            return data;

        }


        /* ==================================================
           CHECK EXISTING SUPABASE SESSION
        ================================================== */

        async function checkExistingSession() {

            const supabase =
                getSupabaseClient();


            const {
                data,
                error
            } = await supabase
                .auth
                .getSession();


            if (error) {

                console.error(
                    "Supabase session check failed:",
                    error
                );

                return null;

            }


            return (
                data &&
                data.session
                    ? data.session
                    : null
            );

        }


        /* ==================================================
           LOGIN
        ================================================== */

        async function handleLogin(
            event
        ) {

            event.preventDefault();


            if (loginProcessing) {

                return;

            }


            if (isLoginLocked()) {

                showLoginMessage(
                    "অনেকবার ভুল Login হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন।",
                    "error"
                );

                return;

            }


            const username =
                String(
                    usernameInput?.value || ""
                ).trim();


            /*
             * Password trim করা হচ্ছে না।
             *
             * কারণ password-এর শুরু/শেষের
             * space valid হতে পারে।
             */

            const password =
                String(
                    passwordInput?.value || ""
                );


            const validation =
                validateLoginInput(
                    username,
                    password
                );


            if (
                !validation.valid
            ) {

                showLoginMessage(
                    validation.message,
                    "error"
                );

                return;

            }


            const email =
                getAuthenticationEmail(
                    username
                );


            if (!email) {

                registerLoginFailure();

                return;

            }


            try {

                loginProcessing = true;


                setLoginLoading(
                    true
                );


                showLoginMessage(
                    "",
                    "info"
                );


                const supabase =
                    getSupabaseClient();


                /* ==========================================
                   SUPABASE AUTHENTICATION
                =========================================== */

                const {
                    data,
                    error
                } = await supabase
                    .auth
                    .signInWithPassword({

                        email:
                            email,

                        password:
                            password

                    });


                /*
                 * Authentication failed
                 */

                if (
    error ||
    !data ||
    !data.user
) {

    console.error(
        "Supabase Login Error:",
        error
    );

    registerLoginFailure();

    showLoginMessage(
        error?.message ||
        "Supabase authentication failed.",
        "error"
    );

    if (passwordInput) {
        passwordInput.value = "";
    }

    return;
}


                /* ==========================================
                   SERVER-SIDE ROLE CHECK
                =========================================== */

                const profile =
                    await getUserProfile(
                        data.user.id
                    );


                /*
                 * Auth successful হলেও
                 * profile না থাকলে access denied.
                 */

                if (!profile) {

                    await supabase
                        .auth
                        .signOut();


                    showLoginMessage(
                        "আপনার account-এর অনুমতি পাওয়া যায়নি।",
                        "error"
                    );


                    if (
                        passwordInput
                    ) {

                        passwordInput.value =
                            "";

                    }


                    return;

                }


                /* ==========================================
                   SUCCESS
                =========================================== */

                resetLoginAttempts();


                showLoginMessage(
                    "Login সফল হয়েছে।",
                    "success"
                );


                /*
                 * এখানে কোনো:
                 *
                 * sessionStorage
                 * localStorage
                 * fake session
                 * password storage
                 *
                 * করা হচ্ছে না।
                 *
                 * Supabase Auth session-ই
                 * authentication-এর source of truth.
                 */


                if (
                    profile.role ===
                    "admin"
                ) {

                    window.location.replace(
                        "admin-dashboard.html"
                    );

                    return;

                }


                if (
                    profile.role ===
                    "manager"
                ) {

                    window.location.replace(
                        "manager-dashboard.html"
                    );

                    return;

                }


                /*
                 * Safety fallback
                 */

                await supabase
                    .auth
                    .signOut();


                showLoginMessage(
                    "অনুমোদিত role পাওয়া যায়নি।",
                    "error"
                );


            } catch (error) {

                console.error(
                    "Login process failed:",
                    error
                );


                showLoginMessage(
                    "Login সিস্টেমে সমস্যা হয়েছে। আবার চেষ্টা করুন।",
                    "error"
                );


            } finally {

                loginProcessing =
                    false;


                setLoginLoading(
                    false
                );

            }

        }


        /* ==================================================
           INPUT EVENTS
        ================================================== */

        if (
            usernameInput
        ) {

            usernameInput.addEventListener(
                "input",
                function() {

                    showLoginMessage(
                        "",
                        "info"
                    );

                }
            );

        }


        if (
            passwordInput
        ) {

            passwordInput.addEventListener(
                "input",
                function() {

                    showLoginMessage(
                        "",
                        "info"
                    );

                }
            );

        }


        /* ==================================================
           FORM SUBMIT
        ================================================== */

        if (
            loginForm
        ) {

            loginForm.addEventListener(
                "submit",
                handleLogin
            );

        }


        /* ==================================================
           PAGE INITIALIZATION
        ================================================== */

        document.addEventListener(
            "DOMContentLoaded",
            async function() {

                try {

                    /*
                     * Supabase client-এর
                     * অস্তিত্ব যাচাই
                     */

                    getSupabaseClient();


                    /*
                     * Existing Auth session
                     * শুধু যাচাই করছি।
                     *
                     * Login page থেকে automatic
                     * redirect করছি না।
                     */

                    await checkExistingSession();


                    /*
                     * Username focus
                     */

                    if (
                        usernameInput
                    ) {

                        usernameInput.focus();

                    }

                } catch (error) {

                    console.error(
                        "Login page initialization failed:",
                        error
                    );


                    showLoginMessage(
                        "Login system প্রস্তুত করা যায়নি।",
                        "error"
                    );

                }

            }
        );


        /* ==================================================
           GLOBAL ERROR
        ================================================== */

        window.addEventListener(
            "error",
            function(event) {

                console.error(
                    "Dalimgari Login Error:",
                    event.error ||
                    event.message
                );

            }
        );


        /* ==================================================
           UNHANDLED PROMISE ERROR
        ================================================== */

        window.addEventListener(
            "unhandledrejection",
            function(event) {

                console.error(
                    "Dalimgari Login Promise Error:",
                    event.reason
                );

            }
        );

    </script>

</body>

</html>
