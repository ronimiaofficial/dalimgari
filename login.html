<!doctype html>
<html lang="bn">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Dalimgari Admin ও Manager Login"
    >

    <title>Login | Dalimgari</title>

    <link
        rel="stylesheet"
        href="login.css"
    >

</head>


<body>

    <main
        class="login-container"
        aria-labelledby="loginTitle"
    >

        <section
            class="login-box"
            aria-describedby="loginDescription"
        >

            <h1 id="loginTitle">
                Login
            </h1>


            <p id="loginDescription">
                Admin অথবা Manager হিসেবে প্রবেশ করুন
            </p>


            <!-- ==========================================
                 Login Form
            =========================================== -->

            <form
                id="loginForm"
                novalidate
            >

                <label for="username">
                    Username
                </label>


                <input
                    type="text"
                    id="username"
                    name="username"
                    autocomplete="username"
                    placeholder="Username"
                    maxlength="100"
                    required
                    aria-required="true"
                >


                <label for="password">
                    Password
                </label>


                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    placeholder="Password"
                    maxlength="200"
                    required
                    aria-required="true"
                >


                <button
                    type="submit"
                    id="loginButton"
                    class="login-button"
                >
                    Login
                </button>

            </form>


            <!-- ==========================================
                 Login Message
            =========================================== -->

            <p
                id="loginMessage"
                class="login-message"
                role="alert"
                aria-live="polite"
            ></p>


            <!-- ==========================================
                 Back To Website
            =========================================== -->

            <div class="back-to-website">

                <a href="index.html">
                    ← মূল ওয়েবসাইটে ফিরে যান
                </a>

            </div>

        </section>

    </main>


    <!-- ==============================================
         Data Layer
    =============================================== -->

    <script src="data-manager.js"></script>


    <!-- ==============================================
         Authentication Controller
    =============================================== -->

    <script>

        // ==================================================
        // AUTHENTICATION CONFIGURATION
        // ==================================================

        const DALIMGARI_SESSION_KEY =
            "dalimgariUser";


        const DALIMGARI_LOGIN_MAX_ATTEMPTS =
            5;


        const DALIMGARI_LOGIN_LOCK_TIME =
            30000;


        // ==================================================
        // LOGIN STATE
        // ==================================================

        let loginAttempts = 0;

        let loginLockedUntil = 0;

        let loginProcessing = false;


        // ==================================================
        // ELEMENTS
        // ==================================================

        const loginForm =
            document.getElementById(
                "loginForm"
            );


        const usernameInput =
            document.getElementById(
                "username"
            );


        const passwordInput =
            document.getElementById(
                "password"
            );


        const loginButton =
            document.getElementById(
                "loginButton"
            );


        const loginMessage =
            document.getElementById(
                "loginMessage"
            );


        // ==================================================
        // MESSAGE
        // ==================================================

        function showLoginMessage(
            message,
            type
        ) {

            if (!loginMessage) {
                return;
            }


            loginMessage.textContent =
                message || "";


            loginMessage.dataset.type =
                type || "info";

        }


        // ==================================================
        // LOADING
        // ==================================================

        function setLoginLoading(
            loading
        ) {

            if (!loginButton) {
                return;
            }


            loginButton.disabled =
                loading;


            loginButton.setAttribute(
                "aria-busy",
                loading
                    ? "true"
                    : "false"
            );


            loginButton.textContent =
                loading
                    ? "Login হচ্ছে..."
                    : "Login";

        }


        // ==================================================
        // ERROR LOG
        // ==================================================

        function logLoginError(
            message,
            error
        ) {

            try {

                if (
                    window.DalimgariDataLayer &&
                    typeof
                        window.DalimgariDataLayer
                            .logError ===
                        "function"
                ) {

                    window.DalimgariDataLayer
                        .logError(
                            message,
                            error
                        );

                    return;

                }


                if (
                    typeof
                        window.logDalimgariError ===
                        "function"
                ) {

                    window.logDalimgariError(
                        message,
                        error
                    );

                }

            } catch (
                loggingError
            ) {

                console.error(
                    "Login error logging failed:",
                    loggingError
                );

            }

        }


        // ==================================================
        // ACTIVITY LOG
        // ==================================================

        function logLoginActivity(
            action,
            details
        ) {

            try {

                if (
                    window.DalimgariDataLayer &&
                    typeof
                        window.DalimgariDataLayer
                            .logActivity ===
                        "function"
                ) {

                    window.DalimgariDataLayer
                        .logActivity(
                            action,
                            details
                        );

                }

            } catch (
                loggingError
            ) {

                console.error(
                    "Login activity logging failed:",
                    loggingError
                );

            }

        }


        // ==================================================
        // CURRENT SESSION
        // ==================================================

        function getCurrentSession() {

            try {

                const rawSession =
                    sessionStorage.getItem(
                        DALIMGARI_SESSION_KEY
                    );


                if (!rawSession) {

                    return null;

                }


                const session =
                    JSON.parse(
                        rawSession
                    );


                if (
                    !session ||
                    typeof session !==
                        "object"
                ) {

                    return null;

                }


                if (
                    session.role !==
                        "admin" &&
                    session.role !==
                        "manager"
                ) {

                    return null;

                }


                if (
                    !session.username ||
                    typeof session.username !==
                        "string"
                ) {

                    return null;

                }


                return session;

            } catch (error) {

                logLoginError(
                    "Invalid login session",
                    error
                );


                return null;

            }

        }


        // ==================================================
        // CLEAR INVALID SESSION
        // ==================================================

        function clearInvalidSession() {

            try {

                sessionStorage.removeItem(
                    DALIMGARI_SESSION_KEY
                );

            } catch (error) {

                logLoginError(
                    "Could not clear invalid session",
                    error
                );

            }

        }


        // ==================================================
        // SESSION CHECK
        // ==================================================

        function checkExistingSession() {

            const session =
                getCurrentSession();


            /*
             * Login page-এ থাকা অবস্থায়
             * existing session থাকলেও
             * dashboard-এ automatic redirect
             * করা হচ্ছে না।
             *
             * এতে Back করলে login page
             * ব্যবহারকারীর নিয়ন্ত্রণে থাকে।
             */

            if (!session) {

                clearInvalidSession();

            }

        }


        // ==================================================
        // SAFE USERNAME
        // ==================================================

        function getUsername() {

            if (!usernameInput) {
                return "";
            }


            return String(
                usernameInput.value || ""
            ).trim();

        }


        // ==================================================
        // PASSWORD
        // ==================================================

        function getPassword() {

            if (!passwordInput) {
                return "";
            }


            /*
             * Password trim করা হচ্ছে না।
             * কারণ password-এর শুরু/শেষে
             * space valid হতে পারে।
             */

            return String(
                passwordInput.value || ""
            );

        }


        // ==================================================
        // LOGIN LOCK
        // ==================================================

        function isLoginLocked() {

            return (
                Date.now() <
                loginLockedUntil
            );

        }


        function lockLogin() {

            loginLockedUntil =
                Date.now() +
                DALIMGARI_LOGIN_LOCK_TIME;


            loginAttempts = 0;


            showLoginMessage(
                "অনেকবার ভুল Login হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন।",
                "error"
            );

        }


        // ==================================================
        // LOGIN FAILURE
        // ==================================================

        function registerLoginFailure() {

            loginAttempts++;


            if (
                loginAttempts >=
                DALIMGARI_LOGIN_MAX_ATTEMPTS
            ) {

                lockLogin();

                return;

            }


            showLoginMessage(
                "Username অথবা Password সঠিক নয়।",
                "error"
            );

        }


        // ==================================================
        // RESET LOGIN ATTEMPTS
        // ==================================================

        function resetLoginAttempts() {

            loginAttempts = 0;

            loginLockedUntil = 0;

        }


        // ==================================================
        // VALIDATE USER INPUT
        // ==================================================

        function validateLoginInput(
            username,
            password
        ) {

            if (!username) {

                return {

                    valid: false,

                    message:
                        "Username দিন।"

                };

            }


            if (!password) {

                return {

                    valid: false,

                    message:
                        "Password দিন।"

                };

            }


            if (
                username.length >
                100
            ) {

                return {

                    valid: false,

                    message:
                        "Username সঠিক নয়।"

                };

            }


            if (
                password.length >
                200
            ) {

                return {

                    valid: false,

                    message:
                        "Password সঠিক নয়।"

                };

            }


            return {

                valid: true,

                message: ""

            };

        }


        // ==================================================
        // CREATE SESSION
        // ==================================================

        function createLoginSession(
            role,
            username
        ) {

            const session = {

                role:
                    role,

                username:
                    username,

                loginAt:
                    new Date().toISOString(),

                sessionVersion:
                    1

            };


            sessionStorage.setItem(
                DALIMGARI_SESSION_KEY,
                JSON.stringify(
                    session
                )
            );


            return session;

        }


        // ==================================================
        // REDIRECT
        // ==================================================

        function redirectByRole(
            role
        ) {

            if (
                role === "admin"
            ) {

                window.location.replace(
                    "admin-dashboard.html"
                );

                return;

            }


            if (
                role === "manager"
            ) {

                window.location.replace(
                    "manager-dashboard.html"
                );

                return;

            }


            clearInvalidSession();


            throw new Error(
                "Unknown authentication role"
            );

        }


        // ==================================================
        // GET SETTINGS
        // ==================================================

        async function loadAuthenticationSettings() {

            if (
                window.DalimgariDataLayer &&
                typeof
                    window.DalimgariDataLayer
                        .getSettingsData ===
                    "function"
            ) {

                return window.DalimgariDataLayer
                    .getSettingsData();

            }


            if (
                typeof
                    window.getSettingsData ===
                    "function"
            ) {

                return window.getSettingsData();

            }


            throw new Error(
                "Authentication Data Layer পাওয়া যায়নি।"
            );

        }


        // ==================================================
        // FIND USER
        // ==================================================

        function authenticateUser(
            settings,
            username,
            password
        ) {

            if (
                !settings ||
                typeof settings !==
                    "object"
            ) {

                return null;

            }


            const admin =
                settings.admin || {};


            const manager =
                settings.manager || {};


            // ----------------------------------------------
            // ADMIN
            // ----------------------------------------------

            if (
                admin.enabled !== false &&
                admin.login &&
                username ===
                    String(
                        admin.login.username ||
                        ""
                    ) &&
                password ===
                    String(
                        admin.login.password ||
                        ""
                    )
            ) {

                return {

                    role:
                        "admin",

                    username:
                        username

                };

            }


            // ----------------------------------------------
            // MANAGER
            // ----------------------------------------------

            if (
                manager.enabled !== false &&
                manager.login &&
                username ===
                    String(
                        manager.login.username ||
                        ""
                    ) &&
                password ===
                    String(
                        manager.login.password ||
                        ""
                    )
            ) {

                return {

                    role:
                        "manager",

                    username:
                        username

                };

            }


            return null;

        }


        // ==================================================
        // LOGIN
        // ==================================================

        async function handleLogin(
            event
        ) {

            event.preventDefault();


            if (loginProcessing) {
                return;
            }


            if (
                isLoginLocked()
            ) {

                showLoginMessage(
                    "অনেকবার ভুল Login হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন।",
                    "error"
                );

                return;

            }


            const username =
                getUsername();


            const password =
                getPassword();


            const validation =
                validateLoginInput(
                    username,
                    password
                );


            if (
                !validation.valid
            ) {

                showLoginMessage(
                    validation.message,
                    "error"
                );

                return;

            }


            try {

                loginProcessing =
                    true;


                setLoginLoading(
                    true
                );


                showLoginMessage(
                    "",
                    "info"
                );


                const settings =
                    await loadAuthenticationSettings();


                const authenticatedUser =
                    authenticateUser(
                        settings,
                        username,
                        password
                    );


                if (
                    !authenticatedUser
                ) {

                    registerLoginFailure();


                    logLoginActivity(
                        "LOGIN_FAILED",
                        {
                            username:
                                username
                        }
                    );


                    return;

                }


                resetLoginAttempts();


                const session =
                    createLoginSession(
                        authenticatedUser.role,
                        authenticatedUser.username
                    );


                logLoginActivity(
                    "LOGIN_SUCCESS",
                    {
                        role:
                            session.role
                    }
                );


                /*
                 * Password কখনো activity log-এ
                 * রাখা হচ্ছে না।
                 */


                redirectByRole(
                    session.role
                );

            } catch (error) {

                logLoginError(
                    "Login process failed",
                    error
                );


                showLoginMessage(
                    "Login সিস্টেমে সমস্যা হয়েছে। আবার চেষ্টা করুন।",
                    "error"
                );

            } finally {

                loginProcessing =
                    false;


                setLoginLoading(
                    false
                );

            }

        }


        // ==================================================
        // PASSWORD FIELD CLEAR
        // ==================================================

        function clearPasswordAfterFailure() {

            if (
                passwordInput
            ) {

                passwordInput.value =
                    "";

            }

        }


        // ==================================================
        // INPUT EVENTS
        // ==================================================

        if (
            usernameInput
        ) {

            usernameInput.addEventListener(
                "input",
                function() {

                    showLoginMessage(
                        "",
                        "info"
                    );

                }
            );

        }


        if (
            passwordInput
        ) {

            passwordInput.addEventListener(
                "input",
                function() {

                    showLoginMessage(
                        "",
                        "info"
                    );

                }
            );

        }


        // ==================================================
        // FORM SUBMIT
        // ==================================================

        if (
            loginForm
        ) {

            loginForm.addEventListener(
                "submit",
                handleLogin
            );

        }


        // ==================================================
        // PAGE INITIALIZATION
        // ==================================================

        document.addEventListener(
            "DOMContentLoaded",
            function() {

                try {

                    checkExistingSession();


                    if (
                        usernameInput
                    ) {

                        usernameInput.focus();

                    }


                } catch (error) {

                    logLoginError(
                        "Login page initialization failed",
                        error
                    );

                }

            }
        );


        // ==================================================
        // GLOBAL ERROR
        // ==================================================

        window.addEventListener(
            "error",
            function(event) {

                logLoginError(
                    "Login page runtime error",
                    event.error ||
                        event.message
                );

            }
        );


        // ==================================================
        // GLOBAL PROMISE ERROR
        // ==================================================

        window.addEventListener(
            "unhandledrejection",
            function(event) {

                logLoginError(
                    "Login page unhandled promise rejection",
                    event.reason
                );

            }
        );

    </script>

</body>

</html>
